cloudwatch_alarms:               true
enabled_nets:
  main:
    thor_url:                       https://mainnet.vechain.org
    mass:
      cpu:                          256
      memory:                       512
      min_capacity:                 1
      spring_profile:               blocks,accounts,chain,export,index,transactions,transfer,registry
      ecr_common_repo:              891377394468.dkr.ecr.eu-west-1.amazonaws.com/vechain/mass
    chain-scanner:
      cpu:                          1024
      memory:                       2048
      spring_profile:               blocks,accounts,chain,export,index,transactions,transfer,registry
      ecr_common_repo:              "891377394468.dkr.ecr.eu-west-1.amazonaws.com/vechain/chain-scanner"
      start_block:
        blocks:                     0
        clauses:                    751
        contracts:                  409987
        fungible_tokens:            0
        nfts:                       1304112
        transactions:               751
        transfers:                  37840
      sync_logger_interval:
        blocks:                     5000
        clauses:                    5000
        contracts:                  5000
        fungible_tokens:            5000
        nfts:                       5000
        transactions:               5000
        transfers:                  5000
    explorer:
      cpu:                          1024
      memory:                       2048
      spring_profile:               blocks,accounts,chain,export,index,transactions,transfer,registry
      ecr_common_repo:              "891377394468.dkr.ecr.eu-west-1.amazonaws.com/vechain/explorer"
    mysql:
      db_port: 3306
      allocated_storage: 2000
      engine: mysql
      engine_version: 8.0.36
      instance_class: db.t3.medium
      app_name: explorer
      deletion_protection: false
      multi_az: false
      storage_encrypted: false
      option_settings: [{}] # optional
      skip_final_snapshot: true
      publicly_accessible: false
      backup_retention_period: 7


